<!DOCTYPE html>
<html>
<head>
    <title>Churn Prediction</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 50px auto; padding: 20px; }
        input, select { width: 100%; padding: 8px; margin: 5px 0 15px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background: #0056b3; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .result { margin-top: 20px; padding: 15px; border-radius: 5px; }
        .high-risk { background: #ffebee; border-left: 4px solid #f44336; }
        .low-risk { background: #e8f5e9; border-left: 4px solid #4caf50; }
        .medium-risk { background: #fff3e0; border-left: 4px solid #ff9800; }
        .loading { text-align: center; color: #666; margin-top: 10px; display: none; }
        h1 { text-align: center; color: #333; }
        .error { background: #ffebee; border-left: 4px solid #f44336; color: #c62828; }
    </style>
</head>
<body>
    <h1>Churn Prediction</h1>
    <form id="predictionForm">
        <label>Credit Score (300-850):</label>
        <input type="number" id="credit_score" value="650" min="300" max="850" required>
        
        <label>Age:</label>
        <input type="number" id="age" value="35" min="18" max="100" required>
        
        <label>Tenure (years with bank):</label>
        <input type="number" id="tenure" value="3" min="0" max="10" required>
        
        <label>Balance ($):</label>
        <input type="number" id="balance" value="50000" min="0" required>
        
        <label>Number of Products:</label>
        <input type="number" id="num_products" value="2" min="1" max="4" required>
        
        <label>Has Credit Card:</label>
        <select id="has_cr_card">
            <option value="true">Yes</option>
            <option value="false">No</option>
        </select>
        
        <label>Is Active Member:</label>
        <select id="is_active_member">
            <option value="true">Yes</option>
            <option value="false">No</option>
        </select>
        
        <label>Estimated Salary ($):</label>
        <input type="number" id="estimated_salary" value="80000" min="0" required>
        
        <label>Gender:</label>
        <select id="gender">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select>
        
        <button type="submit" id="submitBtn">Predict</button>
    </form>
    
    <div class="loading" id="loading">⏳ Loading...</div>
    <div id="result" style="display:none;"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('predictionForm');
            const submitBtn = document.getElementById('submitBtn');
            const loadingDiv = document.getElementById('loading');
            const resultDiv = document.getElementById('result');
            
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                submitBtn.disabled = true;
                loadingDiv.style.display = 'block';
                resultDiv.style.display = 'none';
                
                const data = {
                    credit_score: parseInt(document.getElementById('credit_score').value),
                    age: parseInt(document.getElementById('age').value),
                    tenure: parseInt(document.getElementById('tenure').value),
                    balance: parseFloat(document.getElementById('balance').value),
                    num_products: parseInt(document.getElementById('num_products').value),
                    has_cr_card: document.getElementById('has_cr_card').value === 'true',
                    is_active_member: document.getElementById('is_active_member').value === 'true',
                    estimated_salary: parseFloat(document.getElementById('estimated_salary').value),
                    gender: document.getElementById('gender').value
                };
                
                try {
                    const response = await fetch('/predict/v2', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                    
                    if (!response.ok) {
                        throw new Error(`Server error: ${response.status}`);
                    }
                    
                    const result = await response.json();
                    
                    let riskClass = 'low-risk';
                    if (result.risk_level === 'Medium') riskClass = 'medium-risk';
                    if (result.risk_level === 'High') riskClass = 'high-risk';
                    if (result.risk_level === 'Critical') riskClass = 'high-risk';
                    
                    resultDiv.className = `result ${riskClass}`;
                    resultDiv.innerHTML = `
                        <h3>Prediction Result</h3>
                        <p><strong>Risk Level:</strong> ${result.risk_level}</p>
                        <p><strong>Churn Probability:</strong> ${result.churn_risk_percent || (result.churn_probability * 100).toFixed(1) + '%'}</p>
                        <p><strong>Prediction:</strong> ${result.prediction}</p>
                        <p><strong>Recommendation:</strong> ${result.recommendation}</p>
                        <small>Model: ${result.model_version}</small>
                    `;
                    resultDiv.style.display = 'block';
                    
                } catch (error) {
                    console.error('Error:', error);
                    resultDiv.className = `result error`;
                    resultDiv.innerHTML = `
                        <h3>Error</h3>
                        <p>Failed to get prediction: ${error.message}</p>
                        <p>Make sure the server is running.</p>
                    `;
                    resultDiv.style.display = 'block';
                } finally {
                    submitBtn.disabled = false;
                    loadingDiv.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
