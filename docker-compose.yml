services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./api/models:/app/api/models
    environment:
      - MODEL_PATH=/app/api/models/model.pkl
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
