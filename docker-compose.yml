version: '3.8'

services:
  # API сервис
  api:
    build: ./api
    ports:
      - "8000:8000"
    depends_on:
      - mlflow
      - feast
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mlops-network

  # MLflow для экспериментов
  mlflow:
    image: bitnami/mlflow:latest
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ./mlflow:/mlflow
    networks:
      - mlops-network

  # PostgreSQL для Feature Store
  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=feast
      - POSTGRES_USER=feast
      - POSTGRES_PASSWORD=feast123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mlops-network

  # Feature Store (Feast)
  feast:
    build:
      context: ./feature_store
    depends_on:
      - postgres
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=feast
      - DB_PASSWORD=feast123
      - DB_NAME=feast
    networks:
      - mlops-network

networks:
  mlops-network:
    driver: bridge

volumes:
  postgres_data:
