name: Auto Retrain Model

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install pytest scipy
      
      - name: Train new model
        run: python src/train.py
      
      - name: MDD Analysis (statistical tests)
        id: mdd
        run: pytest tests/test_model_comparison.py::test_mdd_hypothesis -v
      
      - name: Save current model as backup
        if: success()
        run: |
          mkdir -p models
          if [ -f "api/models/model.pkl" ]; then
            cp api/models/model.pkl models/previous_model.pkl
            echo "✓ Saved current model as previous"
          fi
      
      - name: Deploy new model
        if: success()
        run: |
          cp models/candidate_model.pkl api/models/model.pkl
          echo "New model deployed"
      
      - name: Rollback on failure
        if: failure()
        run: |
          bash scripts/rollback.sh
          echo "Rollback executed"
